<div class="search-box">
  <input
    type="text"
    class="search-input"
    oninput="onSearchInput(this)"
    placeholder="{{ site.data.strings.search_placeholder | xml_escape }}"
  />
  <button
    disabled
    data-tooltip="{{ site.data.strings.clear_search | xml_escape }}"
    aria-label="{{ site.data.strings.clear_search | xml_escape }}"
    onclick="onSearchClear()"
  >
    {% include icon.html icon="fa-solid fa-magnifying-glass" %}
  </button>
</div>
